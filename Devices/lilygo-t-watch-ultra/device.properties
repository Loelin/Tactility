general.vendor=LilyGO
general.name=T-Watch Ultra
general.incubating=true

apps.launcherAppId=tactility.launcher

hardware.target=ESP32S3
hardware.flashSize=16MB
hardware.spiRam=true
hardware.spiRamMode=QUAD
hardware.spiRamSpeed=80M
hardware.tinyUsbMsc=true
hardware.esptoolFlashFreq=80M
hardware.bluetooth=true

# SD-card-only build: the root path is on the removable card, so there is no internal data
# partition. device.py derives partitions-16mb-with-sd.csv from the flash size and root path.
storage.path=/sdcard
# Kept for tools that still read it; device.py derives the table from storage.path.
hardware.partitionTable=partitions-16mb-with-sd.csv
# Use the variant with a raw `model` partition for the on-device Whistle engine.
storage.modelPartition=true

display.size=2.06"
display.shape=rounded
display.dpi=326

lvgl.colorDepth=16
# The color buffer(s) are far too large for internal RAM: keep them in PSRAM. The S3 SPI DMA
# cannot read PSRAM, so the CO5300 driver bounces each chunk through internal DMA RAM.
lvgl.preferExternalRam=true
# Full-frame buffer: a full-screen refresh is one TE-waited band.
lvgl.drawBufferLines=502
lvgl.uiSpacing=20
lvgl.uiSize=20
lvgl.fontSize=28

sdkconfig.CONFIG_TASK_WDT_TIMEOUT_S=10
# Keep a larger internal pool for the CO5300's 2 KB bounce buffers when PSRAM is in use; the
# notification/repository services from the latest upstream make internal RAM fragmentation worse.
sdkconfig.CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=196608
sdkconfig.CONFIG_LV_DEF_REFR_PERIOD=10
sdkconfig.CONFIG_CODEC_DUMMY_SUPPORT=y
# The GNSS receiver uses GPIO43/44, which are UART0's default console pins on the ESP32-S3.
# Move the primary console to the native USB-Serial/JTAG so UART1 can own those pins.
sdkconfig.CONFIG_ESP_CONSOLE_UART_DEFAULT=n
sdkconfig.CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
