description: >
  Bosch BHI260AP programmable smart sensor (6-axis IMU + sensor hub). The host talks to it
  through Bosch's BHY2 FIFO protocol; the KLIO firmware is loaded at start-up.

include: ["i2c-device.yaml"]

compatible: "bosch,bhi260ap"

bus: i2c

properties:
  mount-matrix:
    type: values
    default: [1, 0, 0, 0, 1, 0, 0, 0, 1]
    description: >
      Row-major 3x3 rotation matrix that maps the sensor frame onto the device frame, following the
      Linux IIO "mount-matrix" convention (x' = m[0]*x + m[1]*y + m[2]*z, and so on). It is applied
      to the accelerometer and gyroscope readings so consumers always see the device frame,
      regardless of how the IMU is physically oriented on the PCB. Defaults to the identity matrix.
  pin-interrupt:
    type: phandles
    default: GPIO_PIN_SPEC_NONE
    description: Optional host interrupt line (currently polled; reserved for interrupt-driven reads)
